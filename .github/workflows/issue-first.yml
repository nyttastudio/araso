# Comments on a PR that doesn't link an issue labeled `accepted` (CONTRIBUTING.md), and edits that
# comment once it does: .github/scripts/issue-first.sh. It only comments; nothing is closed or blocked.
#
# pull_request_target, so it can comment on PRs from forks. It checks out the base branch (the
# script), never the PR's code, and reads the PR only through the API.
name: Issue first

on:
  pull_request_target:
    types: [opened, reopened, edited]
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: issue-first-${{ github.event.pull_request.number || github.event.issue.number }}

jobs:
  check:
    if: github.event_name == 'pull_request_target' || github.event.label.name == 'accepted'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
      - name: Check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          KIND: ${{ github.event_name == 'issues' && 'issue' || 'pr' }}
          NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: bash .github/scripts/issue-first.sh "$KIND" "$NUMBER"
