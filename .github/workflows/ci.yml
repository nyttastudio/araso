name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # `test` is a required check on main, so the workflow always runs and `test` is skipped (which
  # counts as passing) when nothing the macOS build reads changed: docs, the Windows and Linux
  # ports, tools/, scripts/ and the other workflows. If `changes` itself fails, `test` runs anyway:
  # a skipped `test` would let the merge through untested.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      swift: ${{ steps.filter.outputs.swift }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            swift:
              - '**'
              - '!**/*.md'
              - '!LICENSE'
              - '!docs/**'
              - '!tools/**'
              - '!scripts/**'
              - '!windows/**'
              - '!linux/**'
              - '!.github/!(workflows)/**'
              - '!.github/*'
              - '!.github/workflows/!(ci.yml)'

  test:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.swift == 'true') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .build
          # .build holds absolute paths (the module cache), which change with the repository's
          # name: a cache from before a rename fails the build ("compiled with module cache path").
          key: spm-${{ runner.os }}-${{ github.event.repository.name }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-${{ github.event.repository.name }}-
      - run: swift --version
      - run: swift build
      - run: swift test
