# Run it from the Actions tab (Release → Run workflow) with the new version: the `bump` job sets
# CFBundleShortVersionString to it and CFBundleVersion one up in Resources/Info.plist, runs the
# tests, and pushes that commit to main with a v<version> tag. It pushes as the release GitHub App,
# which must be a bypass actor of the main and release tags rulesets (they let only admins through
# otherwise); a push made with GITHUB_TOKEN also wouldn't start the run below.
#
# On a v<version> tag (pushed by `bump`, or by an admin): scripts/release.sh with the Developer ID
# (signed, notarized, stapled), then a draft release with Araso{,-<version>}.{zip,pkg} and
# .github/release-notes.md as its notes. Fill in the notes and publish it by hand;
# the updater only sees published releases.
#
# Secrets:
#   RELEASE_APP_ID, RELEASE_APP_PRIVATE_KEY            the release GitHub App (Contents: read and write)
#   DEVELOPER_ID_APP_P12, DEVELOPER_ID_INSTALLER_P12   base64 of each exported .p12
#   P12_PASSWORD                                       the password the .p12 files were exported with
#   NOTARY_APPLE_ID, NOTARY_PASSWORD                   Apple ID and an app-specific password
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New version, e.g. 0.1.11'
        required: true
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  bump:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    concurrency: release-bump
    steps:
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # Always main, whatever branch the run was started from.
      # The app's token isn't left in .git/config while the tests run: only the push gets it.
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ steps.app.outputs.token }}
          persist-credentials: false

      - name: Set the version in Info.plist
        env:
          VERSION: ${{ inputs.version }}
        run: |
          grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+' <<< "$VERSION" || { echo "not a version: $VERSION"; exit 1; }
          plist=Resources/Info.plist
          current=$(plutil -extract CFBundleShortVersionString raw $plist)
          build=$(plutil -extract CFBundleVersion raw $plist)
          [[ $(printf '%s\n%s\n' "$current" "$VERSION" | sort -V | tail -1) == "$VERSION" && "$current" != "$VERSION" ]] ||
            { echo "$VERSION is not newer than $current"; exit 1; }
          git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null && { echo "v$VERSION already exists"; exit 1; }
          plutil -replace CFBundleShortVersionString -string "$VERSION" $plist
          plutil -replace CFBundleVersion -string $((build + 1)) $plist
          git diff

      - run: swift test

      - name: Commit and tag
        env:
          VERSION: ${{ inputs.version }}
          SLUG: ${{ steps.app.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          id=$(gh api "/users/$SLUG%5Bbot%5D" --jq .id)
          git config user.name "$SLUG[bot]"
          git config user.email "$id+$SLUG[bot]@users.noreply.github.com"
          git commit -am "$VERSION"
          git tag "v$VERSION"
          # One push: main and the tag land together or not at all (main moved on: run it again).
          git push --atomic "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" HEAD:main "v$VERSION"

  release:
    if: github.event_name == 'push'
    runs-on: macos-latest
    env:
      ARASO_APP_SIGN: "Developer ID Application: Dongbin Lee (2UZ65T3U82)"
      ARASO_PKG_SIGN: "Developer ID Installer: Dongbin Lee (2UZ65T3U82)"
      ARASO_NOTARY_PROFILE: araso
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the tag against Info.plist and main
        run: |
          version=$(plutil -extract CFBundleShortVersionString raw Resources/Info.plist)
          [[ "$GITHUB_REF_NAME" == "v$version" ]] || { echo "tag $GITHUB_REF_NAME, Info.plist $version"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$GITHUB_REF_NAME isn't on main"; exit 1; }

      # Before the keychain: the tests build and run the dependencies' code, which has no business
      # with an unlocked Developer ID.
      - run: swift test

      - name: Keychain with the Developer ID certificates and notary credentials
        env:
          APP_P12: ${{ secrets.DEVELOPER_ID_APP_P12 }}
          PKG_P12: ${{ secrets.DEVELOPER_ID_INSTALLER_P12 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          keychain=$RUNNER_TEMP/release.keychain-db
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          for p12 in APP_P12 PKG_P12; do
            echo "${!p12}" | base64 --decode > "$RUNNER_TEMP/$p12.p12"
            security import "$RUNNER_TEMP/$p12.p12" -k "$keychain" -P "$P12_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/pkgbuild
            rm "$RUNNER_TEMP/$p12.p12"
          done
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # release.sh calls notarytool --keychain-profile without --keychain: it reads the default one.
          security default-keychain -d user -s "$keychain"
          xcrun notarytool store-credentials "$ARASO_NOTARY_PROFILE" \
            --apple-id "$NOTARY_APPLE_ID" --team-id 2UZ65T3U82 --password "$NOTARY_PASSWORD"
          security find-identity -v -p codesigning "$keychain"

      # build-app.sh runs the self-test of the Intel half under Rosetta.
      - run: /usr/bin/pgrep -q oahd || softwareupdate --install-rosetta --agree-to-license

      - run: scripts/release.sh

      - name: Verify the signatures
        run: |
          codesign --verify --strict --deep build/Araso.app
          spctl --assess --type execute build/Araso.app
          pkgutil --check-signature build/release/Araso.pkg
          spctl --assess --type install build/release/Araso.pkg

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          assets=(build/release/Araso.pkg build/release/Araso.zip
                  build/release/Araso-$version.pkg build/release/Araso-$version.zip)
          # A run started again after the draft was made (an upload failed) replaces its assets.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --clobber "${assets[@]}"
          else
            gh release create "$GITHUB_REF_NAME" --draft --title "Araso $version" --notes-file .github/release-notes.md "${assets[@]}"
          fi

      - name: Remove the keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true
