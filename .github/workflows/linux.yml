# The Linux input method (docs/linux-port.md): the Swift core's tests on Linux, then the bridge,
# the fcitx5 addon and the settings window built on Ubuntu 22.04 (its glibc, fcitx5 and Qt are the
# oldest the package runs with), their tests (typing through a fcitx5 instance), and the package
# Araso-linux-<arch>.tar.gz for x86_64 and aarch64 (an artifact). Then real typing on a clean
# Ubuntu 22.04 and 24.04 with only fcitx5 and apps: xdotool into a GTK field and the settings window
# (linux/scripts/typing-test/inside.sh; 22.04 has no fcitx5 module for Qt 6, so only the field there).
#
# On a v<version> tag the tarballs go into the draft release that release.yml makes, as
# Araso-linux-<arch>.tar.gz and Araso-linux-<arch>-<version>.tar.gz (the update check asks for the
# first), once the repository variable ARASO_LINUX_RELEASE is "true".
name: Linux

on:
  push:
    branches: [main, 'aimdevlee/linux-*']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    container: swift:6.2-jammy
    steps:
      - name: Packages
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git cmake ninja-build pkg-config extra-cmake-modules gettext \
            fcitx5 libfcitx5core-dev libfcitx5config-dev libfcitx5utils-dev fcitx5-modules-dev \
            qt6-base-dev libgl-dev
      - uses: actions/checkout@v4
      - name: Swift tests
        run: swift test
      - name: Build, test, pack
        run: sh linux/scripts/build.sh --test --tar
      - name: Arch
        run: echo "ARCH=$(uname -m)" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: Araso-linux-${{ env.ARCH }}
          path: build/linux/Araso-linux-*.tar.gz

  typing:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu:22.04', 'ubuntu:24.04']
        machine:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.machine.runner }}
    container: ${{ matrix.os }}
    steps:
      - name: A user's machine
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            fcitx5 fcitx5-frontend-gtk3 libqt6widgets6 libqt6network6 \
            xvfb xdotool dbus-x11 dbus python3-gi gir1.2-gtk-3.0 libgtk-3-0 imagemagick fonts-noto-cjk procps
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends fcitx5-frontend-qt6 || true
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Araso-linux-${{ matrix.machine.arch }}
          path: dist
      - name: Real typing
        run: |
          tar -C dist -xzf "dist/Araso-linux-${{ matrix.machine.arch }}.tar.gz"
          mkdir -p shots
          ARASO_SHOTS="$PWD/shots" sh linux/scripts/typing-test/inside.sh "$PWD/dist/Araso-linux-${{ matrix.machine.arch }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: typing-${{ matrix.machine.arch }}-${{ strategy.job-index }}
          path: shots

  release:
    # Only once the repository variable ARASO_LINUX_RELEASE is "true".
    needs: typing
    if: startsWith(github.ref, 'refs/tags/v') && vars.ARASO_LINUX_RELEASE == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Araso-linux-*
          merge-multiple: true
          path: dist
      - name: Into the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          # release.yml makes the draft on the same tag; wait for it.
          for i in $(seq 60); do
            gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1 && break
            sleep 30
          done
          gh release upload "$tag" dist/*.tar.gz --clobber --repo "${{ github.repository }}"
