name: 제안 / Suggestion
description: 새 기능이나 동작 변경 / A new feature or a change in behavior
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        PR은 이 이슈에서 메인테이너가 방향에 답한 뒤에 시작해 주세요([CONTRIBUTING.md](https://github.com/nyttastudio/araso/blob/main/CONTRIBUTING.md)).
        Start a PR once the maintainer has answered on the direction here ([CONTRIBUTING.en.md](https://github.com/nyttastudio/araso/blob/main/CONTRIBUTING.en.md)).
  - type: textarea
    id: problem
    attributes:
      label: 어떤 상황에서 불편한가요 / What's the problem
      description: 무엇을 하려다 막혔는지, 지금은 어떻게 되는지 / What you were trying to do and what happens now
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안 / Proposal
      description: 어떻게 동작하면 좋을지. 키와 결과의 예가 있으면 좋습니다. / How it should work, ideally with keys and results.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 영역 / Area
      description: 가장 가까운 것 하나. 메인테이너가 라벨로 붙이고, 필요하면 고칩니다. / The closest one; it becomes a label the maintainer may change.
      options:
        - 한국어 입력 (한글 조합, 세벌식) / Korean
        - 일본어 입력 (로마자, 한자 변환) / Japanese
        - 언어 판단, 단어 나누기 / Language decision, splits
        - 자판 배치 (콜맥 등) / Keyboard layout (Colemak…)
        - 학습, 사전, 텍스트 대치 / Learning, dictionary, text replacements
        - 특정 앱에서만 / One app only
        - 설치, 업데이트 / Install, updates
        - 설정 / Settings
        - Windows
        - Linux
        - 잘 모르겠음 / Not sure
  - type: dropdown
    id: pr
    attributes:
      label: 직접 구현할 생각이 있나요 / Would you implement it
      options:
        - 아니요 / No
        - 네, 방향이 정해지면 / Yes, once the direction is agreed
